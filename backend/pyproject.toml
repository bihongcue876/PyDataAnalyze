[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# ============================================================
# Project
# ============================================================

[project]
name = "pydataanalyze"
version = "0.1.0"
description = "交互式数据分析系统后端"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "PyDataAnalyze Team" }]
keywords = ["data-analysis", "machine-learning", "visualization", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "python-multipart>=0.0.31",
    "pydantic>=2.13.4",
    "aiofiles>=25.1.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
]

# ---- CLI entry points ----
[project.scripts]
pydataanalyze = "backend.main:app"

# ---- PEP 735 dependency groups ----
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.16",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

# ---- Project URLs ----
[project.urls]
Homepage = "https://github.com/icixiooo/PyDataAnalyze"
Documentation = "https://github.com/icixiooo/PyDataAnalyze/blob/main/README.md"
Repository = "https://github.com/icixiooo/PyDataAnalyze"
Issues = "https://github.com/icixiooo/PyDataAnalyze/issues"

# ============================================================
# Tool configurations
# ============================================================

# ---- Ruff (linter + formatter) ----
[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["../test"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=backend",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ---- Mypy ----
[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["../test"]

# ---- Coverage ----
[tool.coverage.run]
source = ["backend"]
omit = ["*/__init__.py", "*/test/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
